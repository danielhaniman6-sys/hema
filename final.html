<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 The Final Page</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", cursive;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffb199);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Floating hearts */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 6s linear infinite;
  opacity: 0.8;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-110vh) scale(1.5);
    opacity: 0;
  }
}

/* Card */
.card {
  width: 420px;
  max-width: 90%;
  padding: 40px;
  border-radius: 25px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(15px);
  text-align: center;
  color: white;
  box-shadow: 0 25px 60px rgba(0,0,0,0.4);
  animation: fadeIn 2s ease forwards;
  z-index: 5;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-size: 26px;
  margin-bottom: 20px;
}

p {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
}

.signature {
  margin-top: 20px;
  font-size: 16px;
  font-style: italic;
  opacity: 0.9;
}

/* Button */
button {
  margin-top: 25px;
  padding: 12px 35px;
  border: none;
  border-radius: 40px;
  font-size: 16px;
  cursor: pointer;
  background: white;
  color: #ff4d6d;
  font-weight: bold;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.1);
}
</style>
</head>

<body>

<div class="card">
  <h1>💌 Sorry for being cringe the whole time 💌</h1>
  <p>
    Hope you liked it...  
    And I truly hope you have a happy day. 💖  
  </p>

  <div class="signature">
    With lots of unexpressed love,<br>
    <strong>– Russil Xavier</strong>
  </div>
</div>

<script>
// Floating hearts generator
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 400);

</script>

</body>
</html>
