<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>💖 RH 💖</title>

<style>
* { box-sizing: border-box; font-family: "Segoe UI", Tahoma; }

body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(circle at top, #ff9ecf, #ff4d6d, #c9184a);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #fff;
}

#sky {
  position: fixed;
  inset: 0;
  z-index: 0;
}

.card {
  background: rgba(255, 255, 255, 0.15);
  border: 1px solid rgba(255, 182, 193, 0.4);
  padding: 40px 50px;
  border-radius: 24px;
  text-align: center;
  z-index: 2;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 25px rgba(255, 105, 180, 0.4);
}

.title { font-size: 30px; margin-bottom: 10px; }
.subtitle { opacity: 0.95; margin-bottom: 25px; }

.timer {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
}

.time-box {
  background: rgba(255, 192, 203, 0.3);
  padding: 15px;
  border-radius: 14px;
  min-width: 80px;
  box-shadow: 0 0 15px rgba(255, 105, 180, 0.6);
}

.time-box span {
  display: block;
  font-size: 32px;
  font-weight: bold;
}

.celebration {
  position: fixed;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 3;
}

.happy-text {
  font-size: 60px;
  font-weight: 900;
  margin-bottom: 30px;
  text-align: center;
  text-shadow:
    0 0 15px #ff4d6d,
    0 0 30px #ff85a2,
    0 0 60px #ffccd5;
}

.continue-btn {
  padding: 15px 40px;
  font-size: 20px;
  border-radius: 40px;
  border: none;
  background: linear-gradient(45deg, #ff4d6d, #ff85a2);
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s ease;
  box-shadow: 0 0 20px rgba(255, 77, 109, 0.7);
}

.continue-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 0 30px rgba(255, 20, 147, 0.9);
}
</style>
</head>

<body>

<canvas id="sky"></canvas>

<div class="card" id="countdownCard">
  <div class="title">💘 Valentine Countdown 💘</div>
  <div class="subtitle">✨ Love is arriving soon ✨</div>
  <div class="timer">
    <div class="time-box">🗓️<span id="days">0</span>Days</div>
    <div class="time-box">⏰<span id="hours">0</span>Hours</div>
    <div class="time-box">⏳<span id="minutes">0</span>Min</div>
    <div class="time-box">💞<span id="seconds">0</span>Sec</div>
  </div>
</div>

<div class="celebration" id="celebration">
  <div class="happy-text">💖 Happy Valentine’s Day Hema 💖</div>
  <button class="continue-btn">Continue ➡️</button>
</div>

<script>
const canvas = document.getElementById("sky");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

window.onresize = () => {
  canvas.width = innerWidth;
  canvas.height = innerHeight;
};

class Firework {
  constructor() {
    this.x = Math.random() * canvas.width;
    this.y = canvas.height;
    this.targetY = Math.random() * canvas.height * 0.4;
    const colors = ["#ff4d6d", "#ff85a2", "#ff99c8", "#ffccd5", "#ff1744"];
    this.color = colors[Math.floor(Math.random() * colors.length)];
    this.exploded = false;
    this.particles = [];
  }
  update() {
    if (!this.exploded) {
      this.y -= 6;
      if (this.y <= this.targetY) this.explode();
    } else {
      this.particles.forEach(p => p.update());
    }
  }
  explode() {
    this.exploded = true;
    for (let i = 0; i < 90; i++) {
      this.particles.push(new Particle(this.x, this.y, this.color));
    }
  }
  draw() {
    if (!this.exploded) {
      ctx.fillStyle = this.color;
      ctx.beginPath();
      ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
      ctx.fill();
    } else {
      this.particles.forEach(p => p.draw());
    }
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    this.speed = Math.random() * 6 + 2;
    this.angle = Math.random() * Math.PI * 2;
    this.life = 100;
  }
  update() {
    this.x += Math.cos(this.angle) * this.speed;
    this.y += Math.sin(this.angle) * this.speed;
    this.life--;
  }
  draw() {
    ctx.globalAlpha = this.life / 100;
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

let fireworks = [], active = false;

function animate() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (active) {
    if (Math.random() < 0.05) fireworks.push(new Firework());
    fireworks.forEach((f, i) => {
      f.update();
      f.draw();
      if (f.exploded && f.particles.every(p => p.life <= 0)) {
        fireworks.splice(i, 1);
      }
    });
  }
  requestAnimationFrame(animate);
}
animate();

const targetDate = new Date("February 14, 2026 00:00:00").getTime();

const card = document.getElementById("countdownCard");
const celebration = document.getElementById("celebration");

setInterval(() => {
  const diff = targetDate - Date.now();
  if (diff <= 0) {
    card.style.display = "none";
    celebration.style.display = "flex";
    active = true;
    return;
  }
  document.getElementById("days").textContent = Math.floor(diff / 86400000);
  document.getElementById("hours").textContent = Math.floor(diff / 3600000) % 24;
  document.getElementById("minutes").textContent = Math.floor(diff / 60000) % 60;
  document.getElementById("seconds").textContent = Math.floor(diff / 1000) % 60;
}, 1000);

document.querySelector(".continue-btn").addEventListener("click", () => {
  window.location.href = "will_you_be_my_valantine.html";
});
</script>

</body>

</html>
